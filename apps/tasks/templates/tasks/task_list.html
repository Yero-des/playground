{% extends "base.html" %}
{% load static %}

{% block content %}

  <div class="container mt-3">
    <ul class="list-group list-group-flush">
    
      {% for task in tasks %}
        <li class="list-group-item">
          <input type="checkbox" class="form-check-input" name="completed" id="checkBox{{task.id}}" {% if task.completed %}checked{% endif %} onchange="markTask(this, {{task.id}})" data-url="{% url 'tasks:mark_task' %}" data-csrf="{{ csrf_token }}"> 
          <span>{{task.content}}</span>
          <a class="icon-link icon-link-hover" style="--bs-icon-link-transform: translate3d(0, -.125rem, 0);" href="{% url 'tasks:delete_task' pk=task.id %}">
            <i class="bi bi-trash2-fill text-danger"></i>
          </a>
        </li>
      {% endfor %}
    
    </ul>
    <a href="{% url 'tasks:add_task' %}" class="btn btn-primary">Nueva tarea</a>
  </div>

{% endblock content %}

{% block scripts %}
  <script src="{% static 'tasks/js/mark-task.js' %}"></script>
{% endblock scripts %}
